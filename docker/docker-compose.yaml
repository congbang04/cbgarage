version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-garage-app
    restart: unless-stopped
    volumes:
      - ..:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    ports:
      - "8000:80"     # Nginx
      - "8081:8081"   # Reverb 
      - "5173:5173"   # Vite 
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: laravel-garage-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Rcvn123456
      MYSQL_DATABASE: garage
      MYSQL_USER: laravel
      MYSQL_PASSWORD: '1'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: