[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# 1. Chạy Nginx
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.stderr.log
stdout_logfile=/var/log/supervisor/nginx.stdout.log

# 2. Chạy PHP-FPM
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.stderr.log
stdout_logfile=/var/log/supervisor/php-fpm.stdout.log

# 3. Chạy Reverb
[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8081
autostart=true
autorestart=true
user=www-data
directory=/var/www
stderr_logfile=/var/log/supervisor/reverb.stderr.log
stdout_logfile=/var/log/supervisor/reverb.stdout.log

# 4. Chạy Vite
[program:vite]
command=npm run dev -- --host 0.0.0.0 --port 5174 --force
autostart=true
autorestart=true
user=www-data
directory=/var/www
stderr_logfile=/var/log/supervisor/vite.stderr.log
stdout_logfile=/var/log/supervisor/vite.stdout.log