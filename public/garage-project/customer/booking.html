<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lịch | Garage Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>

<body>

    <!-- Header -->
    <div class="bg-white shadow-sm p-3 sticky-top">
        <div class="container d-flex align-items-center">
            <a href="home.html" class="text-dark me-3"><i class="fas fa-arrow-left"></i></a>
            <h5 class="mb-0 fw-bold">Đặt lịch sửa chữa</h5>
        </div>
    </div>

    <main class="container py-4">

        <!-- Wizard Steps -->
        <div class="wizard-steps px-4">
            <div class="step-item active">1</div>
            <div class="step-item">2</div>
            <div class="step-item">3</div>
            <div class="step-item">4</div>
        </div>

        <form action="booking-success.html">

            <!-- Step 1: Chọn chi nhánh -->
            <div class="mb-4">
                <h6 class="fw-bold mb-3"><i class="fas fa-map-marker-alt text-primary me-2"></i>Chọn Chi nhánh</h6>
                <div class="card mb-3 border-primary shadow-sm bg-primary-subtle">
                    <div class="card-body">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="branch" id="branch1" checked>
                            <label class="form-check-label w-100" for="branch1">
                                <span class="fw-bold d-block">Garage Quận 7</span>
                                <span class="text-muted small"><i class="fas fa-location-arrow me-1"></i> 123 Nguyễn Thị
                                    Thập, P. Tân Phú</span>
                                <span class="badge bg-success float-end mt-n4">Gần bạn (2km)</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="branch" id="branch2">
                            <label class="form-check-label w-100" for="branch2">
                                <span class="fw-bold d-block">Garage Tân Bình</span>
                                <span class="text-muted small"><i class="fas fa-location-arrow me-1"></i> 456 Cộng Hòa,
                                    P.13</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Chọn Dịch vụ -->
            <div class="mb-4">
                <h6 class="fw-bold mb-3"><i class="fas fa-tools text-primary me-2"></i>Chọn Dịch vụ</h6>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="card service-card p-3 text-center h-100 selected">
                            <input type="checkbox" class="d-none" checked>
                            <div class="service-icon"><i class="fas fa-oil-can"></i></div>
                            <div class="fw-bold small">Thay dầu</div>
                            <div class="text-primary fw-bold mt-1">450k</div>
                        </label>
                    </div>
                    <div class="col-6">
                        <label class="card service-card p-3 text-center h-100">
                            <input type="checkbox" class="d-none">
                            <div class="service-icon"><i class="fas fa-shower"></i></div>
                            <div class="fw-bold small">Rửa xe</div>
                            <div class="text-primary fw-bold mt-1">100k</div>
                        </label>
                    </div>
                    <div class="col-6">
                        <label class="card service-card p-3 text-center h-100">
                            <input type="checkbox" class="d-none">
                            <div class="service-icon"><i class="fas fa-cogs"></i></div>
                            <div class="fw-bold small">Bảo dưỡng</div>
                            <div class="text-primary fw-bold mt-1">Liên hệ</div>
                        </label>
                    </div>
                    <div class="col-6">
                        <label class="card service-card p-3 text-center h-100">
                            <input type="checkbox" class="d-none">
                            <div class="service-icon"><i class="fas fa-search"></i></div>
                            <div class="fw-bold small">Kiểm tra</div>
                            <div class="text-primary fw-bold mt-1">0đ</div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Step 3: Chọn Ngày Giờ -->
            <div class="mb-4">
                <h6 class="fw-bold mb-3"><i class="far fa-clock text-primary me-2"></i>Thời gian hẹn</h6>
                <div class="mb-3">
                    <label class="form-label small text-muted">Ngày đến</label>
                    <input type="date" class="form-control" value="2023-10-25">
                </div>
                <label class="form-label small text-muted">Giờ đến (Dự kiến 60 phút)</label>
                <div class="time-slot-grid">
                    <div class="time-slot-btn disabled">08:00</div>
                    <div class="time-slot-btn disabled">08:30</div>
                    <div class="time-slot-btn active">09:00</div>
                    <div class="time-slot-btn">09:30</div>
                    <div class="time-slot-btn">10:00</div>
                    <div class="time-slot-btn">10:30</div>
                </div>
            </div>

            <!-- Step 4: Thông tin khách -->
            <div class="mb-5">
                <h6 class="fw-bold mb-3"><i class="far fa-user text-primary me-2"></i>Thông tin liên hệ</h6>
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label small">Họ và tên</label>
                            <input type="text" class="form-control" value="Nguyễn Văn A">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Số điện thoại</label>
                            <input type="tel" class="form-control" value="0909123456">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Chọn xe</label>
                            <select class="form-select">
                                <option selected>Toyota Vios - 51G-123.45</option>
                                <option>Ford Ranger - 59C-999.88</option>
                                <option>Xe khác...</option>
                            </select>
                        </div>
                        <div class="mb-0">
                            <label class="form-label small">Ghi chú thêm</label>
                            <textarea class="form-control" rows="2" placeholder="VD: Xe bị kêu ở gầm..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sticky Summary -->
            <div class="booking-summary-sticky">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="small">
                        <div class="text-muted">Tổng tạm tính:</div>
                        <div class="fw-bold text-primary fs-5">450.000đ</div>
                    </div>
                    <div class="text-end small text-muted">
                        <div>1 Dịch vụ</div>
                        <div>09:00 - 25/10</div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill shadow">XÁC NHẬN ĐẶT
                    LỊCH</button>
            </div>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
