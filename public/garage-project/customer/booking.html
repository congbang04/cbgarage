<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đặt xe | Customer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>

<body class="has-sticky-summary">

    <div class="customer-container">
        <!-- Header -->
        <div class="app-header mb-3">
            <a href="car-detail.html" class="text-dark"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="app-header-title">Thông tin đặt xe</h1>
            <div style="width: 20px;"></div>
        </div>

        <!-- Selected Vehicle Preview -->
        <div class="card mb-4 border-0 shadow-sm bg-surface">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <img src="https://placehold.co/100x80/e2e8f0/64748b" class="rounded" alt="Car">
                <div>
                    <h6 class="fw-bold mb-1">Mercedes-Benz C300</h6>
                    <span class="badge badge-soft-primary">2.500.000đ/ngày</span>
                </div>
            </div>
        </div>

        <!-- Booking Form -->
        <form action="booking-success.html">
            <!-- Time Selection -->
            <h6 class="fw-bold mb-3">Thời gian thuê</h6>
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label small text-muted">Nhận xe</label>
                    <input type="datetime-local" class="form-control" value="2023-10-20T09:00">
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Trả xe</label>
                    <input type="datetime-local" class="form-control" value="2023-10-22T09:00">
                </div>
            </div>

            <!-- Location -->
            <h6 class="fw-bold mb-3">Địa điểm</h6>
            <div class="mb-4">
                <div class="form-check card p-3 mb-2 border-primary bg-surface">
                    <input class="form-check-input" type="radio" name="location" id="loc1" checked>
                    <label class="form-check-label w-100" for="loc1">
                        <span class="d-block fw-bold">Showroom Quận 1</span>
                        <small class="text-muted">123 Lê Lợi, P. Bến Nghé, Q.1</small>
                    </label>
                </div>
                <div class="form-check card p-3 bg-surface border-0">
                    <input class="form-check-input" type="radio" name="location" id="loc2">
                    <label class="form-check-label w-100" for="loc2">
                        <span class="d-block fw-bold">Giao xe tận nơi</span>
                        <small class="text-muted">Phí vận chuyển sẽ được tính thêm</small>
                    </label>
                </div>
            </div>

            <!-- Extras -->
            <h6 class="fw-bold mb-3">Dịch vụ đi kèm</h6>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-light">
                    <div>
                        <div class="fw-medium">Tài xế riêng</div>
                        <small class="text-muted">500.000đ/ngày</small>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="driver">
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-light">
                    <div>
                        <div class="fw-medium">Ghế trẻ em</div>
                        <small class="text-muted">100.000đ/ngày</small>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="childseat">
                    </div>
                </div>
            </div>

            <!-- Note -->
            <h6 class="fw-bold mb-3">Ghi chú</h6>
            <textarea class="form-control mb-5" rows="3" placeholder="Yêu cầu đặc biệt..."></textarea>
        </form>
    </div>

    <!-- Sticky Checkout -->
    <div class="sticky-summary">
        <div class="summary-price">
            <small>Tổng cộng (2 ngày)</small>
            <span>5.000.000đ</span>
        </div>
        <a href="booking-success.html" class="btn btn-primary px-4 rounded-pill">
            Xác nhận
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
