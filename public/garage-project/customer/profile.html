<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tài khoản | Customer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>

<body>

    <div class="customer-container">

        <!-- Profile Header -->
        <div class="d-flex align-items-center gap-3 mb-4 mt-2">
            <img src="../assets/img/avatars/default.png"
                onerror="this.src='https://ui-avatars.com/api/?name=Minh+Tuan&background=4f46e5&color=fff&size=128'"
                class="avatar avatar-lg rounded-circle" alt="Profile">
            <div>
                <h4 class="fw-bold mb-0">Nguyễn Minh Tuấn</h4>
                <p class="text-muted small mb-0">Thành viên Bạc</p>
            </div>
            <button class="btn btn-ghost text-muted ms-auto"><i class="fa-solid fa-pen"></i></button>
        </div>

        <!-- Wallet Card -->
        <div class="card bg-dark text-white border-0 shadow mb-4"
            style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%);">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <span class="small opacity-75">Số dư ví</span>
                    <i class="fa-solid fa-wallet opacity-75"></i>
                </div>
                <h2 class="mb-3">0 đ</h2>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-primary py-1 px-3">Nạp tiền</button>
                    <button class="btn btn-sm btn-outline-light py-1 px-3">Lịch sử</button>
                </div>
            </div>
        </div>

        <!-- Menu List -->
        <div class="list-group list-group-flush border rounded-3 bg-surface shadow-sm mb-4">
            <a href="#"
                class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-clock-rotate-left text-primary w-25px text-center"></i>
                    <span>Lịch sử đặt xe</span>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
            <a href="#"
                class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-heart text-danger w-25px text-center"></i>
                    <span>Xe yêu thích</span>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
            <a href="#"
                class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-credit-card text-success w-25px text-center"></i>
                    <span>Phương thức thanh toán</span>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
            <a href="#"
                class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-gear text-secondary w-25px text-center"></i>
                    <span>Cài đặt</span>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
        </div>

        <!-- Logout -->
        <button class="btn btn-outline-danger w-100 py-2">
            <i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất
        </button>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item-link">
            <i class="fa-solid fa-house"></i>
            <span>Trang chủ</span>
        </a>
        <a href="booking.html" class="nav-item-link">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Đặt xe</span>
        </a>
        <a href="chat.html" class="nav-item-link">
            <i class="fa-solid fa-message"></i>
            <span>Hỗ trợ</span>
        </a>
        <a href="profile.html" class="nav-item-link active">
            <i class="fa-solid fa-user"></i>
            <span>Tài khoản</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
