<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt báo giá | Garage Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>

<body class="bg-light">

    <!-- Sticky Header -->
    <div class="bg-white shadow-sm p-3 sticky-top border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <a href="car-detail.html" class="text-dark small text-decoration-none"><i
                        class="fas fa-arrow-left me-1"></i> Trở về</a>
                <h5 class="fw-bold mb-0">Báo giá #QT-9921</h5>
            </div>
            <span class="badge bg-warning text-dark">Chờ duyệt</span>
        </div>
    </div>

    <main class="container py-4 mb-5">

        <!-- Info Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-6">
                        <small class="text-muted">Xe</small>
                        <div class="fw-bold">Toyota Vios</div>
                    </div>
                    <div class="col-6 text-end">
                        <small class="text-muted">Biển số</small>
                        <div class="fw-bold">51G-123.45</div>
                    </div>
                </div>
            </div>
        </div>

        <h6 class="fw-bold mb-3 text-muted">CHI TIẾT HẠNG MỤC</h6>

        <!-- Item 1: Service -->
        <div class="quotation-item">
            <div class="flex-grow-1">
                <div class="d-flex align-items-center mb-1">
                    <span class="badge bg-info-subtle text-info me-2 rounded-1">Công</span>
                    <h6 class="fw-bold mb-0">Thay dầu máy</h6>
                </div>
                <div class="text-muted small">Đơn giá: 150.000đ</div>
            </div>
            <div class="text-end ms-3">
                <div class="fw-bold text-primary mb-2">150.000đ</div>
                <div class="form-check form-switch d-inline-block">
                    <input class="form-check-input" type="checkbox" role="switch" checked>
                </div>
            </div>
        </div>

        <!-- Item 2: Product -->
        <div class="quotation-item">
            <div class="flex-grow-1">
                <div class="d-flex align-items-center mb-1">
                    <span class="badge bg-secondary-subtle text-secondary me-2 rounded-1">Vật tư</span>
                    <h6 class="fw-bold mb-0">Nhớt Castrol 5W30</h6>
                </div>
                <div class="text-muted small">SL: 4 Lít x 120.000đ</div>
            </div>
            <div class="text-end ms-3">
                <div class="fw-bold text-primary mb-2">480.000đ</div>
                <div class="form-check form-switch d-inline-block">
                    <input class="form-check-input" type="checkbox" role="switch" checked>
                </div>
            </div>
        </div>

        <!-- Item 3: Product (Rejected example) -->
        <div class="quotation-item rejected">
            <div class="flex-grow-1">
                <div class="d-flex align-items-center mb-1">
                    <span class="badge bg-secondary-subtle text-secondary me-2 rounded-1">Vật tư</span>
                    <h6 class="fw-bold mb-0">Lọc gió điều hòa</h6>
                </div>
                <div class="text-muted small">SL: 1 Cái x 250.000đ</div>
            </div>
            <div class="text-end ms-3">
                <div class="fw-bold text-muted mb-2 text-decoration-line-through">250.000đ</div>
                <div class="form-check form-switch d-inline-block">
                    <input class="form-check-input" type="checkbox" role="switch">
                </div>
            </div>
        </div>

    </main>

    <!-- Sticky Footer Total -->
    <div class="fixed-bottom bg-white border-top p-3 shadow-lg">
        <div class="container">
            <div class="d-flex justify-content-between align-items-end mb-3">
                <span class="text-muted">Tổng cộng (2 mục):</span>
                <h3 class="fw-bold text-primary mb-0">630.000đ</h3>
            </div>
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-outline-secondary w-100 rounded-pill">Từ chối tất cả</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-primary w-100 rounded-pill fw-bold">PHÊ DUYỆT</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple JS toggle UI logic for demo
        document.querySelectorAll('.form-check-input').forEach(switchBtn => {
            switchBtn.addEventListener('change', function () {
                const item = this.closest('.quotation-item');
                if (this.checked) {
                    item.classList.remove('rejected');
                } else {
                    item.classList.add('rejected');
                }
            });
        });
    </script>
</body>

</html>
