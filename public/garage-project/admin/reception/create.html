<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo phiếu tiếp nhận | Garage Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand"><i class="fas fa-wrench text-primary"></i> GARAGE PRO</a>
            </div>
            <div class="sidebar-menu">
                <a href="list.html" class="nav-link active"><i class="fas fa-car"></i> Tiếp nhận xe</a>
            </div>
        </nav>

        <div class="main-content">
            <header class="top-navbar">
                <div class="d-flex align-items-center">
                    <a href="list.html" class="btn btn-light me-3"><i class="fas fa-arrow-left"></i></a>
                    <h4 class="mb-0 fw-bold">Tiếp nhận xe mới</h4>
                </div>
            </header>

            <div class="p-4">
                <div class="row g-4">
                    <!-- Cột Trái: Thông tin Khách & Xe -->
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5><i class="far fa-user me-2"></i>Thông tin Khách hàng</h5>
                            </div>
                            <div class="card-body">
                                <div class="input-group mb-3">
                                    <input type="text" class="form-control"
                                        placeholder="Nhập SĐT hoặc Biển số để tìm nhanh...">
                                    <button class="btn btn-primary" type="button"><i class="fas fa-search"></i> Tìm
                                        kiếm</button>
                                </div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" value="Nguyễn Văn A">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Số điện thoại <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" value="0909123456">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Địa chỉ</label>
                                        <input type="text" class="form-control" value="Quận 7, TP.HCM">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-car me-2"></i>Thông tin Xe</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Biển số xe <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control fw-bold text-uppercase"
                                            value="51G-123.45">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Hãng xe</label>
                                        <select class="form-select">
                                            <option>Toyota</option>
                                            <option>Honda</option>
                                            <option>Ford</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Dòng xe (Model)</label>
                                        <input type="text" class="form-control" value="Vios">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Số khung (VIN)</label>
                                        <input type="text" class="form-control" placeholder="Nhập 17 ký tự...">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Số máy</label>
                                        <input type="text" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cột Phải: Tình trạng tiếp nhận -->
                    <div class="col-lg-4">
                        <div class="card h-100">
                            <div class="card-header bg-primary text-white">
                                <h5 class="text-white mb-0"><i class="fas fa-clipboard-check me-2"></i>Tình trạng xe
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Số ODO hiện tại (Km)</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control fw-bold" value="45200">
                                        <span class="input-group-text">Km</span>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label d-flex justify-content-between">
                                        <span>Mức nhiên liệu</span>
                                        <span class="fw-bold text-primary">50%</span>
                                    </label>
                                    <input type="range" class="form-range" min="0" max="100" step="10" value="50">
                                    <div class="d-flex justify-content-between small text-muted">
                                        <span>E</span>
                                        <span>F</span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Yêu cầu của khách hàng</label>
                                    <textarea class="form-control" rows="4"
                                        placeholder="VD: Xe bị rung khi phanh, thay nhớt..."></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Ghi chú vết trầy xước (nếu có)</label>
                                    <textarea class="form-control" rows="2"></textarea>
                                </div>

                                <hr>

                                <div class="d-grid gap-2">
                                    <button class="btn btn-primary btn-lg"><i class="fas fa-save me-2"></i> LƯU
                                        PHIẾU</button>
                                    <a href="list.html" class="btn btn-outline-secondary">Hủy bỏ</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
