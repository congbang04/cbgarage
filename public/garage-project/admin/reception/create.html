<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tiếp nhận</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <link rel="stylesheet" href="../../assets/css/reception.css">
</head>

<body>
    <!-- Sidebar trái -->
    <aside class="sidebar">
        <h3>Menu Admin</h3>
        <ul class="list-group">
            <li class="list-group-item"><a href="../dashboard.html">Dashboard</a></li>
            <li class="list-group-item"><a href="list.html">Tiếp nhận</a></li>
            <li class="list-group-item"><a href="../technician/job-list.html">Kỹ thuật viên</a></li>
            <li class="list-group-item"><a href="../warehouse/inventory.html">Kho</a></li>
            <li class="list-group-item"><a href="../cashier/payment-list.html">Thu ngân</a></li>
            <li class="list-group-item"><a href="../settings/branches.html">Cài đặt</a></li>
        </ul>
    </aside>

    <!-- Header trên -->
    <header class="header">
        <h3>Hệ thống Quản lý Gara</h3>
    </header>

    <!-- Main content -->
    <main class="main-content mt-5">
        <div class="container">
            <h2>Form tiếp nhận</h2>
            <form class="reception-form">
                <!-- Thông tin khách -->
                <div>
                    <label for="customer-name" class="form-label">Tên khách hàng</label>
                    <input type="text" class="form-control" id="customer-name" value="Nguyễn Văn A">
                </div>
                <!-- Tình trạng xe -->
                <div>
                    <label for="car-condition" class="form-label">Tình trạng xe</label>
                    <textarea class="form-control" id="car-condition"></textarea>
                </div>
                <!-- ODO -->
                <div>
                    <label for="odo" class="form-label">ODO</label>
                    <input type="number" class="form-control" id="odo" value="50000">
                </div>
                <!-- Thanh trượt mức xăng -->
                <div class="fuel-slider">
                    <label for="fuel" class="form-label">Mức xăng</label>
                    <input type="range" class="form-range" id="fuel" min="0" max="100" value="50">
                </div>
                <button class="btn btn-primary">Tạo</button>
            </form>
        </div>
    </main>
</body>

</html>
