<!-- admin/reception/quotation.html -->
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <link rel="stylesheet" href="../../assets/css/reception.css">
</head>

<body>
    <!-- Sidebar trái -->
    <aside class="sidebar">
        <h3>Menu Admin</h3>
        <ul class="list-group">
            <li class="list-group-item"><a href="../dashboard.html">Dashboard</a></li>
            <li class="list-group-item"><a href="list.html">Tiếp nhận</a></li>
            <li class="list-group-item"><a href="../technician/job-list.html">Kỹ thuật viên</a></li>
            <li class="list-group-item"><a href="../warehouse/inventory.html">Kho</a></li>
            <li class="list-group-item"><a href="../cashier/payment-list.html">Thu ngân</a></li>
            <li class="list-group-item"><a href="../settings/branches.html">Cài đặt</a></li>
        </ul>
    </aside>

    <!-- Header trên -->
    <header class="header">
        <h3>Hệ thống Quản lý Gara</h3>
    </header>

    <!-- Main content -->
    <main class="main-content mt-5">
        <div class="container">
            <h2>Báo giá</h2>
            <!-- Bảng thêm dịch vụ/phụ tùng -->
            <table class="table table-striped quotation-table">
                <thead>
                    <tr>
                        <th>Dịch vụ/Phụ tùng</th>
                        <th>Giá</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Thay nhớt Castrol</td>
                        <td>500.000 VNĐ</td>
                        <td><button class="btn btn-danger btn-sm">Xóa</button></td>
                    </tr>
                </tbody>
            </table>
            <!-- Modal thêm hạng mục (sử dụng Bootstrap modal) -->
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">Thêm hạng mục</button>
            <div class="modal fade" id="addItemModal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Thêm hạng mục</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label for="item-name" class="form-label">Tên</label>
                                    <input type="text" class="form-control" id="item-name">
                                </div>
                                <div class="mb-3">
                                    <label for="item-price" class="form-label">Giá</label>
                                    <input type="number" class="form-control" id="item-price">
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary">Thêm</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
