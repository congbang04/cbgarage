<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân viên | Admin Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar show">
            <div class="sidebar-header">
                <a href="../dashboard.html" class="sidebar-brand"><i class="fa-solid fa-layer-group"></i>
                    <span>Admin</span></a>
            </div>
            <div class="sidebar-content">
                <nav>
                    <a href="branches.html" class="sidebar-nav-link"><i class="fa-solid fa-building"></i> Chi nhánh</a>
                    <a href="services.html" class="sidebar-nav-link"><i class="fa-solid fa-screwdriver-wrench"></i> Dịch
                        vụ</a>
                    <a href="staff.html" class="sidebar-nav-link active"><i class="fa-solid fa-users-gear"></i> Nhân
                        viên</a>
                    <a href="ai-logs.html" class="sidebar-nav-link"><i class="fa-solid fa-robot"></i> AI Logs</a>
                </nav>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <h5 class="mb-0 fw-bold">Quản lý nhân sự</h5>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm"><i class="fa-solid fa-user-plus me-1"></i> Thêm nhân
                        viên</button>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="card border-0 shadow-sm">
                    <table class="table align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Họ tên</th>
                                <th>Vai trò</th>
                                <th>Chi nhánh</th>
                                <th>Email / Liên hệ</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-4">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-2">
                                        <div
                                            class="avatar bg-primary text-white d-flex align-items-center justify-content-center rounded-circle">
                                            L</div>
                                        <div class="fw-bold">Lê Văn Lễ Tân</div>
                                    </div>
                                </td>
                                <td><span class="badge bg-info-subtle text-info">Lễ tân</span></td>
                                <td>Trụ sở Quận 7</td>
                                <td>letan@saas.com<br><small class="text-muted">0901.001.001</small></td>
                                <td><span class="badge bg-success-subtle text-success">Active</span></td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-ghost"><i class="fa-solid fa-pen"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-2">
                                        <div
                                            class="avatar bg-warning text-white d-flex align-items-center justify-content-center rounded-circle">
                                            H</div>
                                        <div class="fw-bold">Nguyễn Kỹ Thuật</div>
                                    </div>
                                </td>
                                <td><span class="badge bg-warning-subtle text-warning">Kỹ thuật viên</span></td>
                                <td>Trụ sở Quận 7</td>
                                <td>kythuat@saas.com<br><small class="text-muted">0902.002.002</small></td>
                                <td><span class="badge bg-success-subtle text-success">Active</span></td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-ghost"><i class="fa-solid fa-pen"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
