<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuất kho | Admin Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar show">
            <div class="sidebar-header">
                <a href="../dashboard.html" class="sidebar-brand"><i class="fa-solid fa-layer-group"></i>
                    <span>Admin</span></a>
            </div>
            <div class="sidebar-content">
                <nav>
                    <a href="inventory.html" class="sidebar-nav-link"><i class="fa-solid fa-boxes-stacked"></i> Tồn
                        kho</a>
                    <a href="requests.html" class="sidebar-nav-link"><i class="fa-solid fa-file-import"></i> Nhập
                        hàng</a>
                    <a href="goods-issue.html" class="sidebar-nav-link active"><i class="fa-solid fa-dolly"></i> Xuất
                        kho</a>
                    <a href="transfer.html" class="sidebar-nav-link"><i class="fa-solid fa-truck-arrow-right"></i>
                        Chuyển kho</a>
                </nav>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <h5 class="mb-0 fw-bold">Xuất kho vật tư</h5>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="row g-4">
                    <!-- Form Selection -->
                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-transparent fw-bold">Thông tin xuất</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Loại xuất kho</label>
                                    <select class="form-select">
                                        <option>Xuất cho sửa chữa (Job)</option>
                                        <option>Xuất hủy/Hư hỏng</option>
                                        <option>Xuất bán lẻ</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mã Job / Khách hàng</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i
                                                class="fa-solid fa-magnifying-glass"></i></span>
                                        <input type="text" class="form-control" placeholder="Tìm JOB ID...">
                                    </div>
                                </div>
                                <div class="p-3 bg-light rounded border mb-3">
                                    <div class="fw-bold text-primary">#JOB-1022</div>
                                    <div class="small">Ford Ranger (29C-888.88)</div>
                                    <div class="small text-muted">KT: Nguyễn Văn Hùng</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Ghi chú</label>
                                    <textarea class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Items List -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm h-100">
                            <div
                                class="card-header bg-transparent fw-bold d-flex justify-content-between align-items-center">
                                <span>Danh sách vật tư</span>
                                <button class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-plus"></i> Thêm
                                    dòng</button>
                            </div>
                            <div class="card-body p-0">
                                <table class="table align-middle mb-0">
                                    <thead class="bg-light">
                                        <tr>
                                            <th class="ps-4">Vật tư</th>
                                            <th class="text-center" style="width: 100px;">ĐV</th>
                                            <th class="text-center" style="width: 120px;">Số lượng</th>
                                            <th class="text-end pe-4" style="width: 50px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="ps-4">
                                                <div class="fw-bold">Lọc nhớt Ford Ranger</div>
                                                <small class="text-muted">PT-FR-001</small>
                                            </td>
                                            <td class="text-center">Cái</td>
                                            <td class="text-center">
                                                <input type="number" class="form-control form-control-sm text-center"
                                                    value="1">
                                            </td>
                                            <td class="text-end pe-4"><i
                                                    class="fa-solid fa-trash text-danger cursor-pointer"></i></td>
                                        </tr>
                                        <tr>
                                            <td class="ps-4">
                                                <div class="fw-bold">Dầu nhớt Castrol 5W30</div>
                                                <small class="text-muted">SP-001</small>
                                            </td>
                                            <td class="text-center">Lít</td>
                                            <td class="text-center">
                                                <input type="number" class="form-control form-control-sm text-center"
                                                    value="6">
                                            </td>
                                            <td class="text-end pe-4"><i
                                                    class="fa-solid fa-trash text-danger cursor-pointer"></i></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="card-footer bg-transparent p-3 text-end">
                                <button class="btn btn-light me-2">Hủy</button>
                                <button class="btn btn-primary px-4">Xác nhận xuất kho</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
