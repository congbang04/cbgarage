<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu nhập hàng | Admin Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar show">
            <div class="sidebar-header">
                <a href="../dashboard.html" class="sidebar-brand"><i class="fa-solid fa-layer-group"></i>
                    <span>Admin</span></a>
            </div>
            <div class="sidebar-content">
                <nav>
                    <a href="inventory.html" class="sidebar-nav-link"><i class="fa-solid fa-boxes-stacked"></i> Tồn
                        kho</a>
                    <a href="requests.html" class="sidebar-nav-link active"><i class="fa-solid fa-file-import"></i> Nhập
                        hàng</a>
                    <a href="goods-issue.html" class="sidebar-nav-link"><i class="fa-solid fa-dolly"></i> Xuất kho</a>
                    <a href="transfer.html" class="sidebar-nav-link"><i class="fa-solid fa-truck-arrow-right"></i>
                        Chuyển kho</a>
                </nav>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <h5 class="mb-0 fw-bold">Yêu cầu nhập hàng (PO)</h5>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i> Tạo đơn nhập</button>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="card border-0 shadow-sm">
                    <table class="table align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Mã PO</th>
                                <th>Nhà cung cấp</th>
                                <th>Người tạo</th>
                                <th>Ngày tạo</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-4">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="ps-4 fw-bold">PO-2023-088</td>
                                <td>Công ty TNHH Castrol BP</td>
                                <td>Admin Kho</td>
                                <td>20/10/2023</td>
                                <td>45.000.000đ</td>
                                <td><span class="badge bg-warning-subtle text-warning">Chờ duyệt</span></td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-ghost text-success"><i
                                            class="fa-solid fa-check"></i></button>
                                    <button class="btn btn-sm btn-ghost text-danger"><i
                                            class="fa-solid fa-xmark"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td class="ps-4 fw-bold">PO-2023-087</td>
                                <td>Phụ tùng Mazda Chính hãng</td>
                                <td>Admin Kho</td>
                                <td>18/10/2023</td>
                                <td>12.500.000đ</td>
                                <td><span class="badge bg-success-subtle text-success">Đã nhập kho</span></td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-ghost"><i class="fa-solid fa-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
