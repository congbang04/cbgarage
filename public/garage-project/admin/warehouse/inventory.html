<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho hàng | Admin Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <!-- SIDEBAR (Simplified for demo) -->
        <aside class="admin-sidebar show">
            <div class="sidebar-header">
                <a href="../dashboard.html" class="sidebar-brand"><i class="fa-solid fa-layer-group"></i>
                    <span>Admin</span></a>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-menu-title">Kho & Vật tư</div>
                <nav>
                    <a href="inventory.html" class="sidebar-nav-link active"><i class="fa-solid fa-boxes-stacked"></i>
                        Tồn kho</a>
                    <a href="requests.html" class="sidebar-nav-link"><i class="fa-solid fa-file-import"></i> Nhập
                        hàng</a>
                    <a href="goods-issue.html" class="sidebar-nav-link"><i class="fa-solid fa-dolly"></i> Xuất kho</a>
                    <a href="transfer.html" class="sidebar-nav-link"><i class="fa-solid fa-truck-arrow-right"></i>
                        Chuyển kho</a>
                </nav>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <h5 class="mb-0 fw-bold">Danh sách tồn kho</h5>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i> Thêm mới</button>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- Filters -->
                <div class="card mb-4 border-0 shadow-sm">
                    <div class="card-body d-flex gap-3">
                        <input type="text" class="form-control" placeholder="Tìm kiếm mã, tên vật tư...">
                        <select class="form-select w-auto">
                            <option>Tất cả danh mục</option>
                            <option>Phụ tùng</option>
                            <option>Dầu nhớt</option>
                        </select>
                        <select class="form-select w-auto">
                            <option>Tất cả kho</option>
                            <option>Kho Quận 1</option>
                        </select>
                    </div>
                </div>

                <!-- Inventory Table -->
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Mã SP</th>
                                    <th>Tên vật tư</th>
                                    <th>Danh mục</th>
                                    <th>Tồn kho</th>
                                    <th>Đơn vị</th>
                                    <th>Giá vốn</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end pe-4">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="ps-4 fw-bold text-primary">SP-001</td>
                                    <td>
                                        <div class="fw-bold">Dầu nhớt Castrol 5W30</div>
                                        <small class="text-muted">Chai 4L</small>
                                    </td>
                                    <td>Dầu nhớt</td>
                                    <td class="fw-bold">150</td>
                                    <td>Chai</td>
                                    <td>450.000đ</td>
                                    <td><span
                                            class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">Sẵn
                                            hàng</span></td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-ghost"><i class="fa-solid fa-pen"></i></button>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="ps-4 fw-bold text-primary">PT-092</td>
                                    <td>
                                        <div class="fw-bold">Lọc gió điều hòa CX-5</div>
                                        <small class="text-muted">Mazda Genuine</small>
                                    </td>
                                    <td>Phụ tùng</td>
                                    <td class="fw-bold text-danger">3</td>
                                    <td>Cái</td>
                                    <td>250.000đ</td>
                                    <td><span
                                            class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill">Sắp
                                            hết</span></td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-ghost"><i class="fa-solid fa-pen"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
