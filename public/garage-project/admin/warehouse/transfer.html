<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luân chuyển kho | Garage Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand"><i class="fas fa-wrench text-primary"></i> GARAGE PRO</a>
            </div>
            <div class="sidebar-menu">
                <a href="inventory.html" class="nav-link"><i class="fas fa-boxes"></i> Tồn kho</a>
                <a href="requests.html" class="nav-link"><i class="fas fa-clipboard-check"></i> Duyệt yêu cầu</a>
                <a href="transfer.html" class="nav-link active"><i class="fas fa-truck-loading"></i> Chuyển kho</a>
            </div>
        </nav>

        <div class="main-content">
            <header class="top-navbar">
                <h4 class="mb-0 fw-bold">Luân chuyển hàng hóa</h4>
            </header>

            <div class="p-4">
                <div class="row g-4">
                    <!-- Form tạo phiếu -->
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header bg-white py-3">
                                <h5 class="mb-0">Tạo phiếu yêu cầu nhập hàng (Từ Kho Tổng)</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Kho nguồn (Xuất)</label>
                                        <select class="form-select" disabled>
                                            <option selected>Kho Tổng (Khu công nghiệp Tân Bình)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Kho đích (Nhập)</label>
                                        <select class="form-select" disabled>
                                            <option selected>Chi nhánh Quận 7 (Hiện tại)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="table-responsive mb-3">
                                    <table class="table table-bordered align-middle">
                                        <thead class="bg-light">
                                            <tr>
                                                <th>Mã / Tên phụ tùng</th>
                                                <th style="width: 150px;">SL Yêu cầu</th>
                                                <th style="width: 50px;"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <select class="form-select border-0">
                                                        <option>Lọc gió điều hòa Mazda CX5</option>
                                                    </select>
                                                </td>
                                                <td>
                                                    <input type="number" class="form-control" value="10">
                                                </td>
                                                <td><button class="btn btn-sm text-danger"><i
                                                            class="fas fa-trash"></i></button></td>
                                            </tr>
                                            <tr>
                                                <td colspan="3" class="text-center">
                                                    <button class="btn btn-sm btn-outline-primary dashed-border w-100">
                                                        <i class="fas fa-plus"></i> Thêm dòng
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Ghi chú</label>
                                    <textarea class="form-control" rows="2"
                                        placeholder="VD: Cần gấp cho xe đang nằm xưởng..."></textarea>
                                </div>

                                <div class="text-end">
                                    <button class="btn btn-primary"><i class="fas fa-paper-plane"></i> Gửi yêu
                                        cầu</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Lịch sử phiếu -->
                    <div class="col-lg-4">
                        <div class="card h-100">
                            <div class="card-header bg-white py-3">
                                <h5 class="mb-0">Lịch sử phiếu</h5>
                            </div>
                            <div class="list-group list-group-flush">
                                <a href="#" class="list-group-item list-group-item-action py-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <strong class="text-primary">#TRF-099</strong>
                                        <span class="badge bg-warning text-dark">Đang vận chuyển</span>
                                    </div>
                                    <div class="small text-muted mb-1">Từ: Kho Tổng</div>
                                    <div class="small text-muted">Hôm nay, 08:00</div>
                                </a>
                                <a href="#" class="list-group-item list-group-item-action py-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <strong>#TRF-098</strong>
                                        <span class="badge bg-success-subtle text-success">Hoàn thành</span>
                                    </div>
                                    <div class="small text-muted mb-1">Từ: Kho Tổng</div>
                                    <div class="small text-muted">24/10/2023</div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
