<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển kho | Admin Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar show">
            <div class="sidebar-header">
                <a href="../dashboard.html" class="sidebar-brand"><i class="fa-solid fa-layer-group"></i>
                    <span>Admin</span></a>
            </div>
            <div class="sidebar-content">
                <nav>
                    <a href="inventory.html" class="sidebar-nav-link"><i class="fa-solid fa-boxes-stacked"></i> Tồn
                        kho</a>
                    <a href="requests.html" class="sidebar-nav-link"><i class="fa-solid fa-file-import"></i> Nhập
                        hàng</a>
                    <a href="goods-issue.html" class="sidebar-nav-link"><i class="fa-solid fa-dolly"></i> Xuất kho</a>
                    <a href="transfer.html" class="sidebar-nav-link active"><i
                            class="fa-solid fa-truck-arrow-right"></i> Chuyển kho</a>
                </nav>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <h5 class="mb-0 fw-bold">Điều chuyển nội bộ</h5>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="card border-0 shadow-sm mx-auto" style="max-width: 800px;">
                    <div class="card-body p-4">
                        <div class="row mb-4 position-relative">
                            <div class="col-5">
                                <label class="form-label text-muted small text-uppercase fw-bold">Kho nguồn</label>
                                <select class="form-select form-select-lg bg-light border-0">
                                    <option>Kho Trung Tâm (Q7)</option>
                                    <option>Kho Chi Nhánh 1</option>
                                </select>
                            </div>
                            <div class="col-2 d-flex align-items-center justify-content-center">
                                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                                    style="width: 40px; height: 40px;">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </div>
                            <div class="col-5">
                                <label class="form-label text-muted small text-uppercase fw-bold">Kho đích</label>
                                <select class="form-select form-select-lg">
                                    <option>Kho Chi Nhánh 1</option>
                                    <option>Kho Trung Tâm (Q7)</option>
                                </select>
                            </div>
                        </div>

                        <hr class="border-light my-4">

                        <h6 class="fw-bold mb-3">Vật tư điều chuyển</h6>
                        <div class="table-responsive mb-3">
                            <table class="table table-bordered align-middle">
                                <thead class="bg-light">
                                    <tr>
                                        <th>Mã VT</th>
                                        <th>Tên vật tư</th>
                                        <th style="width: 150px;">Số lượng</th>
                                        <th style="width: 50px;"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>SP-001</td>
                                        <td>Dầu nhớt Castrol 5W30</td>
                                        <td>
                                            <input type="number" class="form-control" value="20">
                                        </td>
                                        <td class="text-center"><i class="fa-solid fa-trash text-muted"></i></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <button class="btn btn-outline-primary btn-sm btn-dashed w-100 mb-4"><i
                                class="fa-solid fa-plus"></i> Thêm vật tư</button>

                        <div class="d-flex justify-content-end gap-2">
                            <button class="btn btn-light">Lưu nháp</button>
                            <button class="btn btn-primary px-4">Tạo phiếu chuyển</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
