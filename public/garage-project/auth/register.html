<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Modern SaaS</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <div class="auth-brand">
                <i class="fa-solid fa-layer-group"></i>
                <span>SaaS Brand</span>
            </div>

            <!-- Header -->
            <h1 class="auth-title">Tạo tài khoản mới</h1>
            <p class="auth-subtitle">Bắt đầu dùng thử miễn phí 14 ngày của bạn</p>

            <!-- Register Form -->
            <form class="auth-form" action="login.html" method="POST">
                <div class="mb-3">
                    <label for="fullname" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email công việc</label>
                    <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    <!-- Visual Strength Indicator -->
                    <div class="password-strength">
                        <div class="password-strength-bar bg-success" style="width: 75%"></div>
                    </div>
                    <div class="form-text text-muted small mt-1">
                        Ít nhất 8 ký tự, bao gồm chữ hoa và số.
                    </div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">
                        Tôi đồng ý với <a href="#" class="text-primary-main">Điều khoản dịch vụ</a> và <a href="#"
                            class="text-primary-main">Chính sách bảo mật</a>.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-auth-action">
                    Tạo tài khoản
                </button>
            </form>

            <!-- Social Divider -->
            <div class="auth-divider">
                <span>Hoặc đăng ký với</span>
            </div>

            <!-- Social Buttons -->
            <div class="social-buttons">
                <button type="button" class="btn btn-social">
                    <i class="fa-brands fa-google text-danger"></i> Google
                </button>
                <button type="button" class="btn btn-social">
                    <i class="fa-brands fa-facebook text-primary"></i> Facebook
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
