<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | Modern SaaS</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <div class="auth-brand">
                <i class="fa-solid fa-layer-group"></i>
                <span>SaaS Brand</span>
            </div>

            <!-- Header -->
            <h1 class="auth-title">Đặt lại mật khẩu</h1>
            <p class="auth-subtitle">Nhập email của bạn và chúng tôi sẽ gửi hướng dẫn để đặt lại mật khẩu.</p>

            <!-- Alert Info -->
            <div class="alert alert-primary d-flex align-items-center mb-4 fade show" role="alert">
                <i class="fa-solid fa-circle-info me-2"></i>
                <div class="small">
                    Liên kết có hiệu lực trong 24 giờ.
                </div>
            </div>

            <!-- Forgot Password Form -->
            <form class="auth-form" action="login.html" method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label">Email đã đăng ký</label>
                    <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-auth-action">
                    Gửi liên kết khôi phục
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <a href="login.html" class="d-inline-flex align-items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
